name: Phase 1 verification

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  phase1:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Configure Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Configure Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: companion/requirements.lock

      - name: Install locked dependencies
        run: |
          npm ci --ignore-scripts
          python -m pip install --disable-pip-version-check --require-hashes -r companion/requirements.lock

      - name: Verify toolchain and action pins
        run: |
          node -e "if (process.versions.node.split('.')[0] !== '24') process.exit(1)"
          npm run ci:pins

      - name: Verify generated contracts
        run: npm run generate:check

      - name: Validate Python companion
        run: |
          python -m ruff check companion/src companion/tests scripts phase1/evidence/tools
          python -m pytest companion

      - name: Validate and build task pane
        run: |
          npm run check
          npm test
          npm run build

      - name: Validate Word manifest
        run: npm run validate:manifest

      - name: Run local integration probes
        run: |
          npm run test:integration
          npm run test:https
